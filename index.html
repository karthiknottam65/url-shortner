<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener & Security Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 2rem; width: 100%; max-width: 520px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); }
    h1 { font-size: 1.65rem; margin-bottom: 0.4rem; }
    p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
    form { display: flex; flex-direction: column; gap: 0.85rem; }
    input[type="url"] { width: 100%; padding: 0.85rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 1rem; outline: none; }
    input[type="url"]:focus { border-color: #38bdf8; }
    button { padding: 0.85rem; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #7dd3fc; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .security-alert { margin-top: 1.25rem; padding: 1rem 1.1rem; background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; border-left: 4px solid #ef4444; border-radius: 8px; display: none; flex-direction: column; gap: 0.4rem; }
    .security-alert-header { display: flex; align-items: center; justify-content: space-between; color: #fca5a5; font-weight: 700; font-size: 0.98rem; }
    .security-alert p { color: #fecaca; font-size: 0.88rem; line-height: 1.45; }
    .dismiss-btn { background: transparent; color: #fca5a5; padding: 0.15rem 0.45rem; font-size: 0.85rem; border: 1px solid rgba(252, 165, 165, 0.35); }
    .result-box { margin-top: 1.4rem; padding: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; display: none; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .result-box a { color: #38bdf8; text-decoration: none; font-weight: 600; word-break: break-all; }
    .copy-btn { padding: 0.5rem 0.9rem; font-size: 0.85rem; background: #334155; color: #f8fafc; flex-shrink: 0; }
    .error { margin-top: 1rem; color: #f87171; font-size: 0.9rem; display: none; }
    .qr-prompt { margin-top: 1rem; padding: 0.9rem 1rem; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; display: none; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .qr-prompt span { color: #cbd5e1; font-size: 0.9rem; }
    .qr-gen-btn { padding: 0.5rem 0.9rem; font-size: 0.85rem; background: #0284c7; color: #ffffff; flex-shrink: 0; }
    .qr-display { margin-top: 1rem; padding: 1.25rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; display: none; flex-direction: column; align-items: center; gap: 1rem; }
    #qrcode { background: #ffffff; padding: 12px; border-radius: 8px; }
    .download-btn { width: 100%; padding: 0.65rem; font-size: 0.9rem; background: #10b981; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Shorten Your Link</h1>
    <p class="subtitle">Paste a long URL below—scanned automatically for phishing and malware.</p>
    <form id="shortenForm">
      <input type="url" id="longUrl" placeholder="https://example.com/very/long/url/here" required />
      <button type="submit" id="submitBtn">Shorten URL</button>
    </form>
    <div class="security-alert" id="securityAlert">
      <div class="security-alert-header">
        <span id="threatTitle">Security Threat Detected</span>
        <button type="button" class="dismiss-btn" id="dismissAlertBtn">Dismiss</button>
      </div>
      <p id="threatMessage"></p>
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="result-box" id="resultBox">
      <a href="#" id="shortLink" target="_blank"></a>
      <button type="button" class="copy-btn" id="copyBtn">Copy</button>
    </div>
    <div class="qr-prompt" id="qrPrompt">
      <span>Do you want to generate a QR code?</span>
      <button type="button" class="qr-gen-btn" id="generateQrBtn">Generate QR</button>
    </div>
    <div class="qr-display" id="qrDisplay">
      <div id="qrcode"></div>
      <button type="button" class="download-btn" id="downloadQrBtn">Download QR Code (PNG)</button>
    </div>
  </div>
  <script>
    const API_ENDPOINT = "https://7v41d6g2t4.execute-api.ap-south-1.amazonaws.com/shorten";
    
    const form = document.getElementById("shortenForm");
    const longUrlInput = document.getElementById("longUrl");
    const submitBtn = document.getElementById("submitBtn");
    const securityAlert = document.getElementById("securityAlert");
    const threatTitle = document.getElementById("threatTitle");
    const threatMessage = document.getElementById("threatMessage");
    const dismissAlertBtn = document.getElementById("dismissAlertBtn");
    const resultBox = document.getElementById("resultBox");
    const shortLink = document.getElementById("shortLink");
    const copyBtn = document.getElementById("copyBtn");
    const errorMsg = document.getElementById("errorMsg");
    const qrPrompt = document.getElementById("qrPrompt");
    const generateQrBtn = document.getElementById("generateQrBtn");
    const qrDisplay = document.getElementById("qrDisplay");
    const qrContainer = document.getElementById("qrcode");
    const downloadQrBtn = document.getElementById("downloadQrBtn");
    let currentShortUrl = "";

    dismissAlertBtn.addEventListener("click", () => securityAlert.style.display = "none");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      securityAlert.style.display = "none";
      resultBox.style.display = "none";
      qrPrompt.style.display = "none";
      qrDisplay.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Scanning...";

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: longUrlInput.value.trim() }),
        });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Failed to shorten URL");

        if (data.safe === false) {
          threatTitle.textContent = data.threat_title || "Unsafe URL Blocked";
          threatMessage.textContent = data.alert_message || "This link was flagged as potentially unsafe.";
          securityAlert.style.display = "flex";
          return;
        }

        currentShortUrl = data.short_url;
        shortLink.href = currentShortUrl;
        shortLink.textContent = currentShortUrl;
        resultBox.style.display = "flex";
        copyBtn.textContent = "Copy";
        qrPrompt.style.display = "flex";
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Shorten URL";
      }
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(shortLink.textContent);
      copyBtn.textContent = "Copied!";
    });

    generateQrBtn.addEventListener("click", () => {
      if (!currentShortUrl) return;
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, { text: currentShortUrl, width: 180, height: 180, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
      qrPrompt.style.display = "none";
      qrDisplay.style.display = "flex";
    });

    downloadQrBtn.addEventListener("click", () => {
      const canvas = qrContainer.querySelector("canvas");
      const img = qrContainer.querySelector("img");
      const dataUrl = canvas ? canvas.toDataURL("image/png") : (img ? img.src : "");
      if (!dataUrl) return;
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "short-url-qr.png";
      link.click();
    });
  </script>
</body>
</html>
