<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener & Security Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 2rem; width: 100%; max-width: 520px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); }
    h1 { font-size: 1.65rem; margin-bottom: 0.4rem; }
    p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
    form { display: flex; flex-direction: column; gap: 0.85rem; }
   input[type="url"], input[type="text"], select { width: 100%; padding: 0.85rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; font-family: inherit; }
    input[type="url"]:focus { border-color: #38bdf8; }
    button { padding: 0.85rem; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #7dd3fc; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    
    /* Security Alert (Red) */
    .security-alert { margin-top: 1.25rem; padding: 1rem 1.1rem; background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; border-left: 4px solid #ef4444; border-radius: 8px; display: none; flex-direction: column; gap: 0.4rem; }
    .security-alert-header { display: flex; align-items: center; justify-content: space-between; color: #fca5a5; font-weight: 700; font-size: 0.98rem; }
    .security-alert p { color: #fecaca; font-size: 0.88rem; line-height: 1.45; }
    
    /* Success Alert (Green) */
    .success-alert { margin-top: 1.25rem; padding: 1rem 1.1rem; background: rgba(16, 185, 129, 0.12); border: 1px solid #10b981; border-left: 4px solid #10b981; border-radius: 8px; display: none; flex-direction: column; gap: 0.4rem; }
    .success-alert-header { display: flex; align-items: center; justify-content: space-between; color: #34d399; font-weight: 700; font-size: 0.98rem; }
    .success-alert p { color: #a7f3d0; font-size: 0.88rem; line-height: 1.45; }
    
    .dismiss-btn { background: transparent; padding: 0.15rem 0.45rem; font-size: 0.85rem; cursor: pointer; border-radius: 4px; }
    .dismiss-red { color: #fca5a5; border: 1px solid rgba(252, 165, 165, 0.35); }
    .dismiss-green { color: #34d399; border: 1px solid rgba(52, 211, 153, 0.35); }
    
    .result-box { margin-top: 1.4rem; padding: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; display: none; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .result-box a { color: #38bdf8; text-decoration: none; font-weight: 600; word-break: break-all; }
    .copy-btn { padding: 0.5rem 0.9rem; font-size: 0.85rem; background: #334155; color: #f8fafc; flex-shrink: 0; }
    .error { margin-top: 1rem; color: #f87171; font-size: 0.9rem; display: none; }
    .qr-prompt { margin-top: 1rem; padding: 0.9rem 1rem; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; display: none; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .qr-prompt span { color: #cbd5e1; font-size: 0.9rem; }
    .qr-gen-btn { padding: 0.5rem 0.9rem; font-size: 0.85rem; background: #0284c7; color: #ffffff; flex-shrink: 0; }
    .qr-display { margin-top: 1rem; padding: 1.25rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; display: none; flex-direction: column; align-items: center; gap: 1rem; }
    #qrcode { background: #ffffff; padding: 12px; border-radius: 8px; }
    .download-btn { width: 100%; padding: 0.65rem; font-size: 0.9rem; background: #10b981; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Shorten Your Link</h1>
    <p class="subtitle">Drop your link here for instant shortening and security Checks</p>
   <form id="shortenForm">
      <input type="url" id="longUrl" placeholder="https://example.com/long/url" required />
      <input type="text" id="customAlias" placeholder="Custom alias (optional, e.g. my-resume)" pattern="[a-zA-Z0-9\-]+" title="Letters, numbers, and hyphens only" />
      
      <select id="expireSelect" title="Link Expiration">
        <option value="0">Never Expire</option>
        <option value="1">Expire in 1 Day</option>
        <option value="7">Expire in 7 Days</option>
        <option value="30">Expire in 30 Days</option>
      </select>

      <button type="submit" id="submitBtn">Shorten URL</button>
    </form>
    
    </form>

    <!-- The Result Box that was missing -->
    <div id="result" class="hidden">
        <p>Your short link:</p>
        <a id="shortUrl" href="#" target="_blank"></a>
        <button id="copyBtn">Copy</button>
    </div>

    <!-- The Security Alert Box -->
    <div id="securityAlert" style="display: none; background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 8px; margin-top: 1rem; flex-direction: column; gap: 0.5rem;">
        <h3 id="threatTitle" style="margin: 0; font-size: 1.1rem;"></h3>
        <p id="threatMessage" style="margin: 0; font-size: 0.9rem;"></p>
        <button id="dismissAlertBtn" style="background: #ef4444; color: white; border: none; padding: 0.5rem; border-radius: 4px; cursor: pointer; margin-top: 0.5rem;">Dismiss</button>
    </div>

    <!-- Green Success Alert -->
    <div class="success-alert" id="successAlert">
      <div class="success-alert-header">
        <span>URL is Safe!</span>
        <button type="button" class="dismiss-btn dismiss-green" id="dismissSuccessBtn">Dismiss</button>
      </div>
      <p>No malware or phishing detected. Your shortened URL is ready below.</p>
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="result-box" id="resultBox">
      <a href="#" id="shortLink" target="_blank"></a>
      <button type="button" class="copy-btn" id="copyBtn">Copy</button>
    </div>
    <div class="qr-prompt" id="qrPrompt">
      <span>Do you want to generate a QR code?</span>
      <button type="button" class="qr-gen-btn" id="generateQrBtn">Generate QR</button>
    </div>
    <div class="qr-display" id="qrDisplay">
      <div id="qrcode"></div>
      <button type="button" class="download-btn" id="downloadQrBtn">Download QR Code (PNG)</button>
    </div>
  </div>
  <script>
    const API_ENDPOINT = "https://2w8oxe2o29.execute-api.ap-south-1.amazonaws.com/shorten";

    const form = document.getElementById("shortenForm");
    const longUrlInput = document.getElementById("longUrl");
    const customAliasInput = document.getElementById("customAlias");
    const expireSelect = document.getElementById("expireSelect");
    const submitBtn = document.getElementById("submitBtn");

    const securityAlert = document.getElementById("securityAlert");
    const threatTitle = document.getElementById("threatTitle");
    const threatMessage = document.getElementById("threatMessage");
    const dismissAlertBtn = document.getElementById("dismissAlertBtn");

    const resultDiv = document.getElementById("result");
    const shortUrlDisplay = document.getElementById("shortUrl");
    const copyBtn = document.getElementById("copyBtn");

    dismissAlertBtn.addEventListener("click", () => {
        securityAlert.style.display = "none";
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault(); 
        
        securityAlert.style.display = "none";
        resultDiv.classList.add("hidden");
        submitBtn.textContent = "Shortening...";
        submitBtn.disabled = true;

        try {
            const payload = { 
                url: longUrlInput.value.trim(),
                expiration_days: parseInt(expireSelect.value)
            };
            
            if (customAliasInput.value.trim()) {
                payload.custom_alias = customAliasInput.value.trim();
            }

            const response = await fetch(API_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            
            const data = await response.json();

            if (data.error) {
                threatTitle.textContent = "Error";
                threatMessage.textContent = data.error;
                securityAlert.style.display = "flex";
                return;
            }

            if (!data.safe) {
                threatTitle.textContent = data.threat_title;
                threatMessage.textContent = data.alert_message;
                securityAlert.style.display = "flex";
            } else {
                shortUrlDisplay.href = data.short_url;
                shortUrlDisplay.textContent = data.short_url;
                resultDiv.classList.remove("hidden");
            }
        } catch (err) {
            threatTitle.textContent = "Connection Error";
            threatMessage.textContent = "Failed to connect to the server.";
            securityAlert.style.display = "flex";
        } finally {
            submitBtn.textContent = "Shorten URL";
            submitBtn.disabled = false;
        }
    });

    copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shortUrlDisplay.href);
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy", 2000);
    });

    // If you have a QR code function, it goes here:
    // downloadQrBtn.addEventListener("click", () => { ... });
</script>
</body>
</html>
